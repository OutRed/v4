<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unblocked Games — OutRed | Free Games for School</title>
  <meta name="description" content="Browse hundreds of unblocked games free to play at school or home. Search by name, filter by category, and play instantly on any device." />
  <meta name="theme-color" content="#e63946" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link id="favicon" rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon" />
  <script src="/js/tabcloak.js"></script>
  <link rel="manifest" href="/assets/json/manifest.json" />
</head>
<body>

<div class="page">
  <div class="container">

    <!-- ── AD: Leaderboard top ─────────────────────────────── -->
    <div class="ad-slot ad-leaderboard" id="ad-top" style="margin-top:28px; margin-bottom:32px; margin-left:auto; margin-right:auto;">
      <!-- REPLACE with leaderboard ad tag (728×90) -->
    </div>

    <!-- ── PAGE HEADER ──────────────────────────────────────── -->
    <div style="margin-bottom:24px;">
      <h1 style="font-size:clamp(1.6rem,4vw,2.4rem); margin-bottom:6px;">Games</h1>
      <p style="color:var(--text-muted); font-size:0.9rem;">Browse the full library — click any game to play instantly.</p>
    </div>

    <!-- ── SEARCH ────────────────────────────────────────────── -->
    <div class="page-search" id="page-search-wrap">
      <span class="ps-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </span>
      <input
        type="search" id="page-search" autocomplete="off"
        placeholder="Search games…" aria-label="Search games"
      />
      <span class="ps-clear" id="search-clear" title="Clear search" aria-label="Clear search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </span>
    </div>

    <!-- ── CATEGORY CHIPS ────────────────────────────────────── -->
    <div class="cat-row" id="cat-row" role="group" aria-label="Filter by category">
      <!-- Populated by games.js -->
    </div>

    <!-- ── MAIN LAYOUT ───────────────────────────────────────── -->
    <div class="browse-layout">

      <!-- Main content -->
      <div class="browse-main">
        <!-- Results bar -->
        <div class="results-bar">
          <span class="results-count" id="results-count" aria-live="polite">Loading…</span>
        </div>

        <!-- Games grid -->
        <div class="games-grid games-grid-lg" id="games-grid" role="list" aria-label="Games list">
          <!-- Populated by games.js -->
        </div>

        <!-- AD: below games grid -->
        <div class="ad-slot ad-full-banner" id="ad-below-grid" style="margin-top:32px;">
          <!-- REPLACE with ad tag (responsive/leaderboard) -->
        </div>
      </div>

      <!-- Sidebar -->
      <aside class="browse-sidebar" aria-label="Sidebar">

        <!-- AD: Rectangle -->
        <div class="ad-slot ad-rectangle" id="ad-sidebar-top">
          <!-- REPLACE with ad tag (300×250) -->
        </div>

        <!-- Top Games widget -->
        <div class="widget">
          <div class="widget-title">Top Games</div>
          <div class="top-games-list" id="top-games-list" aria-label="Top games">
            <!-- Populated by games.js -->
          </div>
        </div>

        <!-- AD: Second rectangle -->
        <div class="ad-slot ad-rectangle" id="ad-sidebar-bottom">
          <!-- REPLACE with ad tag (300×250) -->
        </div>

        <!-- Community widget -->
        <div class="widget" style="text-align:center;">
          <div class="widget-title">Community</div>
          <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:14px; line-height:1.6;">
            Request a game or report an issue in our Discord!
          </p>
          <a href="https://discord.gg/FB6NtPkfwY" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
            Join Discord
          </a>
        </div>

      </aside>
    </div>

  </div>
</div>

<script src="/js/core.js"></script>
<script src="/js/games.js"></script>

</body>
</html>
